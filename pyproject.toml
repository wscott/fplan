[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fplan"
version = "0.3"
authors = [
  { name="Wayne Scott", email="wsc9tt@gmail.com" },
]
description = "Early retirement financial calculator"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]
dependencies = [
    'scipy'
]

[project.urls]
Homepage = "https://github.com/wscott/fplan"
Issues = "https://github.com/wscott/fplan/issues"

[project.scripts]
fplan = "fplan:main"

[tool.setuptools]
py-modules = ["fplan"]

[tool.setuptools.package-dir]
"" = "src"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16",
]

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.ruff]
target-version = "py311"
